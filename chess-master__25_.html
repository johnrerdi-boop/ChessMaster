<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#12141a;--p:#1c1f27;--p2:#272b35;--t:#e9eaee;--m:#9097a3;--a:#d4a73a;--g:#4cc38a;--r:#e5534b;--sl:#f0d9b5;--sd:#b58863;--pw:#fff;--pb:#1a1a1a;--sw:0 1px 2px #000;--sb:0 0 1px #fff9;color-scheme:dark}

@keyframes sh{to{background-position:200%}}

#bw{display:flex;gap:8px}
#ev{width:24px;background:#2b2b2b;border-radius:5px;position:relative;overflow:hidden;align-self:stretch}

.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#0005}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px solid #0006}

.mvl{padding:2px 6px;border-radius:5px;cursor:pointer;background:var(--p2);font-size:13px}.mvl.cur{outline:2px solid var(--a)}
.Best{border-bottom:2px solid #4cc38a}.Excellent{border-bottom:2px solid #88bbdd}.Good{border-bottom:2px solid #779988}.Inaccuracy{border-bottom:2px solid #ffcc33}.Mistake{border-bottom:2px solid #ff9900}.Blunder{border-bottom:2px solid #ff3333}

.up{color:var(--g)}.dn{color:var(--r)}

dialog{background:var(--p);color:var(--t);border:1px solid var(--a);border-radius:12px}
.sw{display:inline-block;margin:4px}.sw.on button{border-color:var(--a);background:#3a3320}
.bar{height:8px;background:var(--p2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.kb{position:absolute;top:2px;right:2px;width:36%;max-width:30px;z-index:6;pointer-events:none;animation:pop .45s cubic-bezier(.2,1.7,.4,1)}.kb svg{width:100%;display:block;filter:drop-shadow(0 1px 2px #000a)}@keyframes pop{from{transform:scale(0)}}

#bd{position:relative}.arw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.mb{position:absolute;top:-2px;right:-2px;width:40%;max-width:32px;z-index:6;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.7,.4,1)}.mb svg{width:100%;display:block;filter:drop-shadow(0 1px 2px #000a)}

.gbt svg,.gnav svg{width:20px;height:20px;fill:#d7d6d4;flex:none}
#gml{position:relative;max-height:215px;overflow:auto;background:#2b2a27;border-radius:6px;margin-bottom:10px}
.gr2{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center;padding:0 6px}.gr2:nth-child(odd){background:#302f2c}.gr2 .mn{color:#8b8987;font-weight:700;font-size:13px}
.mc{display:flex;align-items:center;gap:5px;min-height:34px;padding:0 7px;border-radius:4px;cursor:pointer;font-weight:700;font-size:14px}.mc:hover{background:#3d3b37}.mc.cur{background:#4a4845;box-shadow:0 0 0 1px #6b6966}.mc svg.ci,.mc i{width:17px;height:17px;flex:none}
.sn{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",system-ui,sans-serif}

.gft{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gft button,.gft select{font-size:12px;padding:5px 9px}
details.sum{margin-top:10px;background:#2b2a27;border-radius:8px;padding:8px 10px}details.sum summary{cursor:pointer;font-weight:700}
.kh{font-weight:800;color:#fff;margin:4px 0 6px}
.kev{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#2b2a27;border:0;border-left:3px solid var(--kc,#555);border-radius:6px;padding:8px 10px;margin-bottom:6px}.kev:hover{background:#34322f}.kev.cur{background:#403e3a}
.kev svg{width:22px;height:22px;flex:none;margin-top:1px}.kt{font-size:13.5px;line-height:1.35}.kt small{color:#9a9894}.kx{color:#c9c8c6;font-size:12.5px}
</style></head><body>

</main><dialog id="pd"></dialog><dialog id="dg"></dialog>
<script>
const $=s=>document.querySelector(s),D=document;

["Emerald Green","#eeeed2","#769656","linear-gradient(135deg,#fff3,#0000 50%,#0002)","#2d3a22"],
["Ocean Blue","#dee3e6","#8ca2ad","linear-gradient(135deg,#fff3,#0000 50%,#0002)","#2b3b46"],
["Marble","#e8e8e8","#9a9a9a","radial-gradient(circle at 30% 20%,#fff6,#0000 45%),repeating-linear-gradient(115deg,#0000 0 17px,#0000000b 17px 18px)","#55565a"],
["Royal Purple","#e8dff5","#8a6bbd","linear-gradient(135deg,#fff3,#0000 50%,#0002)","#3a2a5c"],

["Midnight","#5a6070","#262a33","linear-gradient(135deg,#fff2,#0000 50%,#0003)","#0d0f14"],

["Tournament","#ebecd0","#739552","none","#262421"],
["Ice","#e6f3fb","#7fb2d4","linear-gradient(160deg,#fff8,#0000 40%,#fff3 60%,#0000)","#25485f"],

["Neon","#00f0ff","#ff2bd6","0 0 8px #00f0ff","0 0 8px #ff2bd6","#fff8","#fff8"],
["Gold & Silver","#e8e8f2","#d4a73a","0 1px 2px #000","0 1px 2px #000","#555a66","#6b4f08"],

["Ink","#fff","#000","none","none","#000","#fff"]];
